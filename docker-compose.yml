services:
  mysql:
    profiles: ["mysql"]
    image: mysql:8.4
    container_name: agrivision-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: agrivision
      MYSQL_USER: agrivision
      MYSQL_PASSWORD: agrivision
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - agrivision_mysql:/var/lib/mysql
    command:
      [
        "--default-authentication-plugin=mysql_native_password",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
      ]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  mariadb:
    profiles: ["mariadb"]
    image: mariadb:10.11
    container_name: agrivision-mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: agrivision
      MYSQL_USER: agrivision
      MYSQL_PASSWORD: agrivision
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - agrivision_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  agrivision_mysql:
  agrivision_mariadb:
